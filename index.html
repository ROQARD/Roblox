<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00ff88;
            --text: #ffffff;
            --text-dim: #999;
            --error: #ff4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 600px; position: relative; }

        .search-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        h1 { font-weight: 800; font-size: 2.5rem; margin-bottom: 20px; letter-spacing: -1.5px; }
        
        .input-group {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,255,136,0.1); }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 28px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }

        #status { margin-top: 15px; font-size: 0.85rem; font-weight: 500; min-height: 20px; }

        .result-card {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .header-box img { 
            width: 100px; height: 100px; 
            border-radius: 15px; 
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 18px;
        }

        .full-width { grid-column: span 2; }

        .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
        .value { font-size: 1.4rem; font-weight: 800; }
        .live-count { color: var(--accent); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-top: 10px; max-height: 100px; overflow-y: auto; }

        .footer-credit {
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-dim);
            letter-spacing: 1px;
            opacity: 0.6;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <h1>Tracker<span style="color:var(--accent)">.</span></h1>
        <div class="input-group">
            <input type="text" id="placeId" placeholder="Enter Place ID...">
            <button onclick="fetchStats()">Scan</button>
        </div>
        <div id="status"></div>
    </div>

    <div id="results" class="result-card">
        <div class="header-box">
            <img id="gIcon" src="">
            <div style="text-align:left;">
                <div id="gName" style="font-weight:800; font-size:1.4rem; margin-bottom:4px;">Experience</div>
                <div id="gCreator" style="color:var(--accent); font-size:0.9rem; font-weight:600;">By Creator</div>
                <div id="gGenre" style="font-size:0.75rem; color:var(--text-dim); margin-top:5px;">Genre: Unknown</div>
            </div>
        </div>

        <div class="grid-stats">
            <div class="stat-item">
                <div class="label">Playing Now</div>
                <div class="value live-count" id="gPlaying">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Total Visits</div>
                <div class="value" id="gVisits">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Favorites</div>
                <div class="value" id="gFavs">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Likes</div>
                <div class="value" id="gLikes">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Created</div>
                <div class="value" id="gCreated" style="font-size:1rem;">-</div>
            </div>
            <div class="stat-item">
                <div class="label">Last Updated</div>
                <div class="value" id="gUpdated" style="font-size:1rem;">-</div>
            </div>
            <div class="stat-item full-width">
                <div class="label">About</div>
                <div class="desc" id="gDesc">No description available.</div>
            </div>
        </div>
    </div>
</div>

<div class="footer-credit">BY ROQARD</div>

<script>
    const BRIDGE = "https://api.codetabs.com/v1/proxy?quest=";
    const DOMAIN = "roproxy.com";

    function formatNum(n) {
        if (!n || isNaN(n)) return "0";
        if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
        if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
        return n.toLocaleString();
    }

    async function request(url) {
        const res = await fetch(BRIDGE + encodeURIComponent(url));
        if (!res.ok) throw new Error();
        return res.json();
    }

    async function fetchStats() {
        const input = document.getElementById('placeId').value.trim();
        const id = input.match(/\d+/)?.[0];
        const status = document.getElementById('status');
        const results = document.getElementById('results');

        if (!id) {
            status.innerText = "Error: Invalid ID";
            status.style.color = "var(--error)";
            return;
        }

        status.innerText = "Synchronizing...";
        status.style.color = "var(--text-dim)";
        results.style.display = 'none';

        try {
            // Get Universe ID
            const uniData = await request(`https://apis.${DOMAIN}/universes/v1/places/${id}/universe`);
            const uId = uniData.universeId;

            // Fetch Multi-Data
            const [gameData, iconData, voteData, favData] = await Promise.all([
                request(`https://games.${DOMAIN}/v1/games?universeIds=${uId}`),
                request(`https://thumbnails.${DOMAIN}/universes/v1/icons?universeIds=${uId}&size=150x150&format=Png`),
                request(`https://games.${DOMAIN}/v1/games/votes?universeIds=${uId}`),
                request(`https://games.${DOMAIN}/v1/games/${uId}/favorites/count`)
            ]);

            const d = gameData.data[0];
            const v = voteData.data[0];

            // Map UI
            document.getElementById('gName').innerText = d.name;
            document.getElementById('gCreator').innerText = "By " + d.creator.name;
            document.getElementById('gGenre').innerText = "Genre: " + (d.genre || "N/A");
            document.getElementById('gDesc').innerText = d.description || "No description.";
            document.getElementById('gPlaying').innerText = formatNum(d.playing);
            document.getElementById('gVisits').innerText = formatNum(d.visits);
            document.getElementById('gFavs').innerText = formatNum(favData.favoritesCount);
            document.getElementById('gLikes').innerText = formatNum(v.upVotes);
            document.getElementById('gCreated').innerText = new Date(d.created).toLocaleDateString();
            document.getElementById('gUpdated').innerText = new Date(d.updated).toLocaleDateString();
            document.getElementById('gIcon').src = iconData.data?.[0]?.imageUrl || "";

            status.innerText = "Data Secure.";
            status.style.color = "var(--accent)";
            results.style.display = 'flex';

        } catch (err) {
            status.innerText = "Error: Protocol Failure";
            status.style.color = "var(--error)";
        }
    }
</script>

</body>
</html>
