<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoStats</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00ff88;
            --text: #ffffff;
            --text-dim: #999;
            --error: #ff4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 600px; position: relative; }

        .search-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        h1 { font-weight: 800; font-size: 2.5rem; margin-bottom: 20px; letter-spacing: -1.5px; }
        
        .input-group {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,255,136,0.1); }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 28px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }

        #status { margin-top: 15px; font-size: 0.85rem; font-weight: 500; min-height: 20px; }

        /* Recent Searches */
        .recent-container {
            margin-top: 20px;
            text-align: left;
            display: none; /* Hidden until there are recents */
            animation: fadeIn 0.3s ease-in;
        }
        .recent-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .recent-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .recent-list::-webkit-scrollbar { height: 6px; }
        .recent-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        .recent-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 140px;
        }
        .recent-item:hover { border-color: var(--accent); background: rgba(0, 255, 136, 0.05); }
        .recent-item img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
        .recent-item span { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }

        /* Results */
        .result-card {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .header-box img { 
            width: 100px; height: 100px; 
            border-radius: 15px; 
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 18px;
        }

        .full-width { grid-column: span 2; }
        .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
        .value { font-size: 1.4rem; font-weight: 800; }
        .live-count { color: var(--accent); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-top: 10px; max-height: 100px; overflow-y: auto; }

        .footer-credit {
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-dim);
            letter-spacing: 1px;
            opacity: 0.6;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <h1>Ro<span style="color:var(--accent)">Stats</span>.</h1>
        <div class="input-group">
            <input type="text" id="placeId" placeholder="Enter Place ID...">
            <button onclick="fetchStats()">Scan</button>
        </div>
        <div id="status"></div>
        
        <div id="recentContainer" class="recent-container">
            <div class="recent-title">Recent Searches</div>
            <div id="recentList" class="recent-list"></div>
        </div>
    </div>

    <div id="results" class="result-card">
        <div class="header-box">
            <img id="gIcon" src="">
            <div style="text-align:left;">
                <div id="gName" style="font-weight:800; font-size:1.4rem; margin-bottom:4px;">Experience</div>
                <div id="gCreator" style="color:var(--accent); font-size:0.9rem; font-weight:600;">By Creator</div>
                <div id="gGenre" style="font-size:0.75rem; color:var(--text-dim); margin-top:5px;">Genre: Unknown</div>
            </div>
        </div>

        <div class="grid-stats">
            <div class="stat-item">
                <div class="label">Playing Now</div>
                <div class="value live-count" id="gPlaying">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Total Visits</div>
                <div class="value" id="gVisits">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Favorites</div>
                <div class="value" id="gFavs">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Likes</div>
                <div class="value" id="gLikes">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Created</div>
                <div class="value" id="gCreated" style="font-size:1rem;">-</div>
            </div>
            <div class="stat-item">
                <div class="label">Last Updated</div>
                <div class="value" id="gUpdated" style="font-size:1rem;">-</div>
            </div>
            <div class="stat-item full-width">
                <div class="label">About</div>
                <div class="desc" id="gDesc">No description available.</div>
            </div>
        </div>
    </div>
</div>

<div class="footer-credit">BY ROQARD</div>

<script>
    const BRIDGE = "https://api.codetabs.com/v1/proxy?quest=";
    const DOMAIN = "roproxy.com";
    const RECENT_KEY = "rostats_history";

    // Initialize recent searches on page load
    document.addEventListener("DOMContentLoaded", renderRecents);

    function formatNum(n) {
        if (!n || isNaN(n)) return "0";
        if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
        if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
        return n.toLocaleString();
    }

    async function request(url) {
        const res = await fetch(BRIDGE + encodeURIComponent(url));
        if (!res.ok) throw new Error("HTTP_ERROR");
        return res.json();
    }

    // Recent Searches Logic
    function getRecents() {
        return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
    }

    function saveRecent(id, name, icon) {
        let recents = getRecents();
        // Remove duplicate if exists
        recents = recents.filter(item => item.id !== id);
        // Add to front
        recents.unshift({ id, name, icon });
        // Keep only last 5
        if (recents.length > 5) recents.pop();
        localStorage.setItem(RECENT_KEY, JSON.stringify(recents));
        renderRecents();
    }

    function renderRecents() {
        const recents = getRecents();
        const container = document.getElementById('recentContainer');
        const list = document.getElementById('recentList');
        
        if (recents.length === 0) {
            container.style.display = 'none';
            return;
        }

        container.style.display = 'block';
        list.innerHTML = '';

        recents.forEach(game => {
            const el = document.createElement('div');
            el.className = 'recent-item';
            el.onclick = () => {
                document.getElementById('placeId').value = game.id;
                fetchStats();
            };
            el.innerHTML = `
                <img src="${game.icon}" onerror="this.src='https://tr.rbxcdn.com/default-icon.png'">
                <span>${game.name}</span>
            `;
            list.appendChild(el);
        });
    }

    // Main Fetch Logic
    async function fetchStats() {
        const input = document.getElementById('placeId').value.trim();
        const id = input.match(/\d+/)?.[0];
        const status = document.getElementById('status');
        const results = document.getElementById('results');

        if (!id) {
            status.innerText = "Error: Invalid ID format";
            status.style.color = "var(--error)";
            return;
        }

        status.innerText = "Synchronizing data...";
        status.style.color = "var(--text-dim)";
        results.style.display = 'none';

        try {
            let uId = id;
            
            // Step 1: Try to convert Place ID to Universe ID
            try {
                const uniData = await request(`https://apis.${DOMAIN}/universes/v1/places/${id}/universe`);
                if (uniData && uniData.universeId) {
                    uId = uniData.universeId;
                }
            } catch(e) {
                // If this fails, the user might have directly inputted a Universe ID.
                // We silently catch this and proceed using the raw ID.
            }

            // Step 2: Fetch Multi-Data
            const [gameData, iconData, voteData, favData] = await Promise.all([
                request(`https://games.${DOMAIN}/v1/games?universeIds=${uId}`),
                request(`https://thumbnails.${DOMAIN}/universes/v1/icons?universeIds=${uId}&size=150x150&format=Png`),
                request(`https://games.${DOMAIN}/v1/games/votes?universeIds=${uId}`),
                request(`https://games.${DOMAIN}/v1/games/${uId}/favorites/count`)
            ]);

            // Validate we actually found a game
            if (!gameData || !gameData.data || gameData.data.length === 0) {
                throw new Error("NOT_FOUND");
            }

            const d = gameData.data[0];
            const v = (voteData.data && voteData.data[0]) ? voteData.data[0] : { upVotes: 0 };
            const iconUrl = iconData.data?.[0]?.imageUrl || "https://tr.rbxcdn.com/default-icon.png";

            // Map UI
            document.getElementById('gName').innerText = d.name;
            document.getElementById('gCreator').innerText = "By " + d.creator.name;
            document.getElementById('gGenre').innerText = "Genre: " + (d.genre || "N/A");
            document.getElementById('gDesc').innerText = d.description || "No description.";
            document.getElementById('gPlaying').innerText = formatNum(d.playing);
            document.getElementById('gVisits').innerText = formatNum(d.visits);
            document.getElementById('gFavs').innerText = formatNum(favData.favoritesCount);
            document.getElementById('gLikes').innerText = formatNum(v.upVotes);
            document.getElementById('gCreated').innerText = new Date(d.created).toLocaleDateString();
            document.getElementById('gUpdated').innerText = new Date(d.updated).toLocaleDateString();
            document.getElementById('gIcon').src = iconUrl;

            // Save to recent searches
            saveRecent(id, d.name, iconUrl);

            status.innerText = "Data Secure.";
            status.style.color = "var(--accent)";
            results.style.display = 'flex';

        } catch (err) {
            if (err.message === "NOT_FOUND") {
                status.innerText = "Error: Game not found. Check the ID.";
            } else {
                status.innerText = "Error: Network synchronization failed.";
            }
            status.style.color = "var(--error)";
        }
    }
</script>

</body>
</html>
