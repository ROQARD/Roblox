<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoStats</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        :root {
            --bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00ff88;
            --text: #ffffff;
            --text-dim: #999;
            --error: #ff4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 600px; position: relative; }
        .search-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        h1 { font-weight: 800; font-size: 2.5rem; margin-bottom: 20px; letter-spacing: -1.5px; }
        .input-group { display: flex; gap: 12px; }
        input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 28px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        #status { margin-top: 15px; font-size: 0.85rem; font-weight: 500; min-height: 20px; }
        .recent-container { margin-top: 20px; text-align: left; display: none; }
        .recent-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
        .recent-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            min-width: 140px;
        }
        .recent-item img { width: 28px; height: 28px; border-radius: 6px; }
        .result-card { display: none; flex-direction: column; gap: 12px; }
        .header-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .header-box img { width: 100px; height: 100px; border-radius: 15px; object-fit: cover; }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-item { background: var(--glass); border: 1px solid var(--border); padding: 18px; border-radius: 18px; }
        .full-width { grid-column: span 2; }
        .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
        .value { font-size: 1.4rem; font-weight: 800; }
        .footer-credit { position: fixed; bottom: 20px; right: 25px; font-size: 0.75rem; font-weight: 800; color: var(--text-dim); opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <h1>Ro<span style="color:var(--accent)">Stats</span>.</h1>
        <div class="input-group">
            <input type="text" id="placeId" placeholder="Enter Place ID...">
            <button id="scanBtn">Scan</button>
        </div>
        <div id="status"></div>
        <div id="recentContainer" class="recent-container">
            <div id="recentList" class="recent-list"></div>
        </div>
    </div>

    <div id="results" class="result-card">
        <div class="header-box">
            <img id="gIcon" src="">
            <div style="text-align:left;">
                <div id="gName" style="font-weight:800; font-size:1.4rem;">Experience</div>
                <div id="gCreator" style="color:var(--accent); font-size:0.9rem;">By Creator</div>
            </div>
        </div>
        <div class="grid-stats">
            <div class="stat-item">
                <div class="label">Playing Now</div>
                <div id="gPlaying" class="value" style="color:var(--accent)">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Total Visits</div>
                <div id="gVisits" class="value">0</div>
            </div>
            <div class="stat-item full-width">
                <div class="label">Last Updated</div>
                <div id="gUpdated" class="value" style="font-size:1.1rem;">-</div>
            </div>
        </div>
    </div>
</div>

<div class="footer-credit">BY ROQARD</div>

<script src="script.js"></script>
</body>
</html>
